# dosbox.conf — Configuracion del entorno DOSBox para el laboratorio
# Unidad 5: Emuladores y Virtualizacion
# Arquitectura de Computadores — Ingenieria de Sistemas

[cpu]
core=normal
cputype=auto
cycles=8000         # velocidad adecuada para trabajo agil con NASM

[dosbox]
memsize=16

[render]
scaler=normal2x     # escala la ventana 2x para mejor visibilidad

[autoexec]
# ============================================================
# IMPORTANTE: Ajusta la ruta segun tu sistema operativo
# Windows ejemplo:
#   mount c "C:\Users\TuUsuario\apellido-post1-u5"
# Linux/macOS ejemplo:
#   mount c "/home/tuusuario/apellido-post1-u5"
# ============================================================
mount c "C:\Users\juank\kher-post1-u5"
c:
echo DOSBox listo. Directorio de trabajo: C:\
cls
